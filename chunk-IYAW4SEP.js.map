<header class="admin-navbar bg-white border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
    
    <!-- Identidad Institucional -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-[#b00725] text-white flex items-center justify-center font-bold text-lg shadow-sm">
        CBB
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-bold text-slate-900 tracking-tight">Backoffice RAG</h1>
          <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-red-50 text-[#b00725] border border-red-200 rounded-full">
            Admin
          </span>
        </div>
        <p class="text-xs text-slate-500 hidden sm:block">Gestión de Base de Conocimiento — Colegio Bertolt Brecht</p>
      </div>
    </div>

    <!-- Usuario Activo y Acciones -->
    <div class="flex items-center gap-3 sm:gap-4">
      <a 
        routerLink="/" 
        class="text-xs font-medium text-slate-600 hover:text-[#b00725] px-3 py-1.5 rounded-lg hover:bg-slate-100 transition-colors flex items-center gap-1.5">
        <span>🌐</span>
        <span class="hidden md:inline">Ver Portal Público</span>
      </a>

      @if (session(); as user) {
        <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>
        
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full bg-slate-100 border border-slate-300 flex items-center justify-center text-xs font-bold text-slate-700">
            {{ user.username.slice(0, 2).toUpperCase() }}
          </div>
          <div class="hidden sm:block text-left">
            <div class="text-xs font-semibold text-slate-800 leading-none">{{ user.username }}</div>
            <div class="text-[10px] text-slate-500 mt-0.5">{{ user.role }} • Área: {{ user.areaDefault }}</div>
          </div>
        </div>

        <button
          type="button"
          (click)="logout.emit()"
          class="px-3 py-1.5 rounded-xl text-xs font-semibold text-red-700 bg-red-50 hover:bg-red-100 border border-red-200 transition-colors cursor-pointer flex items-center gap-1">
          <span>Salir</span>
        </button>
      }
    </div>

  </div>
</header>
